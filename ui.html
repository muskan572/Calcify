<html>
  <head>
    <title>UI Page</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <h1>CALCULATOR</h1>
    <div id="container">
      <div>
        <input id="output" type="text" placeholder="0" readonly />
      </div>
      <div class="row ac-row">
        <button class="btn ac">AC</button>
      </div>

      <div id="first_row" class="row">
        <button class="btn red">7</button>
        <button class="btn blue">8</button>
        <button class="btn green">9</button>
        <button class="btn yellow">/</button>
      </div>
      <div id="second_row" class="row">
        <button class="btn red">4</button>
        <button class="btn blue">5</button>
        <button class="btn green">6</button>
        <button class="btn yellow">*</button>
      </div>
      <div id="third_row" class="row">
        <button class="btn red">1</button>
        <button class="btn blue">2</button>
        <button class="btn green">3</button>
        <button class="btn yellow">+</button>
      </div>
      <div id="fourth_row" class="row">
        <button class="btn red">0</button>
        <button class="btn blue">-</button>
        <button class="btn green">=</button>
        <button class="btn yellow">%</button>
      </div>
    </div>
  </body>
</html>
